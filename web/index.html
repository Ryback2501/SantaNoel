<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amigo invisible</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Amigo invisible</h1>
      <p>Organiza tu amigo invisible: haz el sorteo, envía los correos y comparte la carta a los Reyes Magos.</p>

      <!-- Both areas start hidden: the page shows one only after checking the session. -->
      <section id="signin-area" class="signin" hidden>
        <div id="signin-button"></div>
        <p id="signin-message" class="signin-message" role="alert"></p>
      </section>

      <section id="organizer-area" class="organizer" hidden>
        <p id="greeting" class="greeting"></p>

        <ul id="groups-list" class="groups-list"></ul>
        <p id="groups-message" class="groups-message"></p>
        <button type="button" id="create-group-button" class="button" hidden>Crear grupo</button>

        <form id="create-group-form" class="form" hidden>
          <label for="group-name">Nombre del grupo</label>
          <input id="group-name" name="group-name" type="text" autocomplete="off" />
          <label for="first-name">Tu nombre</label>
          <input id="first-name" name="first-name" type="text" autocomplete="off" />
          <p id="create-group-message" class="form-message" role="alert"></p>
          <div class="form-buttons">
            <button type="submit" class="button">Guardar</button>
            <button type="button" id="create-group-cancel" class="button button-secondary">Cancelar</button>
          </div>
        </form>

        <button type="button" id="signout-button" class="button button-secondary">Cerrar sesión</button>
      </section>

      <p id="server-status" class="server-status" role="status"></p>
    </main>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/groups.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>

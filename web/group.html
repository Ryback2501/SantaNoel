<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amigo invisible</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <p><a href="index.html" class="back-link">Volver a mis grupos</a></p>

      <p id="page-message" class="page-message" role="alert"></p>

      <!-- Hidden until the server answers, so nothing of the group shows before the check. -->
      <div id="group-content" class="group-content" hidden>
        <h1 id="group-title"></h1>
        <button type="button" id="rename-button" class="button">Cambiar nombre</button>

        <form id="rename-form" class="form" hidden>
          <label for="rename-name">Nombre del grupo</label>
          <input id="rename-name" name="rename-name" type="text" autocomplete="off" />
          <p id="rename-message" class="form-message" role="alert"></p>
          <div class="form-buttons">
            <button type="submit" class="button">Guardar</button>
            <button type="button" id="rename-cancel" class="button button-secondary">Cancelar</button>
          </div>
        </form>

        <!-- Shown only: participants are not edited on this page. -->
        <ul id="participants" class="participants"></ul>
      </div>
    </main>
    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/groups.js"></script>
    <script src="js/group-page.js"></script>
  </body>
</html>

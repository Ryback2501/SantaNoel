<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amigo invisible</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page" inert>
      <p><a href="index.html" class="back-link">Volver a mis grupos</a></p>

      <p id="page-message" class="page-message" role="alert"></p>

      <!-- Hidden until the server answers, so nothing of the group shows before the check. -->
      <div id="group-content" class="group-content" hidden>
        <h1 id="group-title"></h1>
        <button type="button" id="rename-button" class="button">Cambiar nombre</button>

        <form id="rename-form" class="form" hidden>
          <label for="rename-name">Nombre del grupo</label>
          <input id="rename-name" name="rename-name" type="text" autocomplete="off" />
          <p id="rename-message" class="form-message" role="alert"></p>
          <div class="form-buttons">
            <button type="submit" class="button">Guardar</button>
            <button type="button" id="rename-cancel" class="button button-secondary">Cancelar</button>
          </div>
        </form>

        <!-- Shown when the draw is done: the list below stays visible, but cannot change. -->
        <p id="lock-message" class="lock-message" role="status"></p>

        <ul id="participants" class="participants"></ul>
        <p id="participants-message" class="form-message" role="alert"></p>

        <button type="button" id="add-participant-button" class="button">Añadir participante</button>

        <form id="add-participant-form" class="form" hidden>
          <label for="participant-name">Nombre</label>
          <input id="participant-name" name="participant-name" type="text" autocomplete="off" />
          <label for="participant-email">Correo</label>
          <input id="participant-email" name="participant-email" type="text" inputmode="email" autocomplete="off" />
          <p id="add-participant-message" class="form-message" role="alert"></p>
          <div class="form-buttons">
            <button type="submit" class="button">Guardar</button>
            <button type="button" id="add-participant-cancel" class="button button-secondary">Cancelar</button>
          </div>
        </form>

        <!-- One participant's row; its edit form opens inside it. -->
        <template id="participant-row-template">
          <li class="participant">
            <span class="participant-text"></span>
            <span class="participant-exclusions"></span>
            <span class="participant-buttons">
              <button type="button" class="button button-small edit-button">Editar</button>
              <button type="button" class="button button-small button-secondary remove-button">Quitar</button>
            </span>
            <form class="form edit-form" hidden>
              <label>Nombre <input class="edit-name" type="text" autocomplete="off" /></label>
              <label> Correo <input class="edit-email" type="text" inputmode="email" autocomplete="off" /> </label>
              <!-- Ticked = can give to; the page fills the tick boxes in. -->
              <div class="exclusions-field">
                <span class="exclusions-label">Puede regalar a</span>
                <button type="button" class="exclusions-toggle" aria-expanded="false">
                  <span class="exclusions-summary">Todos</span>
                </button>
                <div class="exclusions-panel" hidden></div>
              </div>
              <p class="form-message edit-message" role="alert"></p>
              <div class="form-buttons">
                <button type="submit" class="button">Guardar</button>
                <button type="button" class="button button-secondary edit-cancel">Cancelar</button>
              </div>
            </form>
          </li>
        </template>
      </div>
    </main>

    <!-- Blocks the page while it waits for the server: shown from the start, until the first check ends. -->
    <div id="wait-layer" class="wait-layer">
      <div class="wait-box">
        <div class="spinner" aria-hidden="true"></div>
        <p id="wait-text" class="wait-text" role="status"></p>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/groups.js"></script>
    <script src="js/exclusions.js"></script>
    <script src="js/waiting.js"></script>
    <script src="js/group-page.js"></script>
  </body>
</html>

name: Release

# Fires on every push to main (i.e. after a dev->main fast-forward). Tags the
# version, builds & uploads release artifacts, creates the GitHub Release, and —
# only when the matching repo variable is enabled — publishes the site to GitHub
# Pages (PAGES_DEPLOY_ENABLED) and updates the production Apps Script web app in
# place (BACKEND_DEPLOY_ENABLED). The production setup is described in the README.

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  read-version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: could not parse a semver version from package.json"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  create-tag:
    name: Create version tag
    needs: [read-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag v$VERSION
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

  create-artifacts:
    name: Build & zip artifacts
    needs: [read-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Build & zip
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
          # The production backend: the build writes it into config.js when the variable is set.
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          npm ci
          npm run build
          (cd dist && zip -qr "../santanoel-${VERSION}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: santanoel-*.zip
          retention-days: 7

  github-release:
    name: GitHub Release
    needs: [read-version, create-tag, create-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          # Empty body — release notes are written by hand on the release page.
          gh release create "v$VERSION" --title "v$VERSION" --notes "" \
            "santanoel-$VERSION.zip"

  deploy:
    name: Deploy (prod, gated)
    needs: [github-release]
    runs-on: ubuntu-latest
    if: vars.PAGES_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: "npm ci"
      - run: "npm run build"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-disabled:
    name: Deploy (prod, gated — DISABLED)
    needs: [github-release]
    runs-on: ubuntu-latest
    if: vars.PAGES_DEPLOY_ENABLED != 'true'
    steps:
      - run: echo "PAGES_DEPLOY_ENABLED repo variable is not 'true' — deploy skipped."

  deploy-backend:
    name: Deploy backend (prod, gated)
    needs: [github-release]
    runs-on: ubuntu-latest
    if: vars.BACKEND_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Push the code and update the production deployment
        env:
          APPS_SCRIPT_ID: ${{ vars.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: bash scripts/deploy-backend.sh
      - name: Remove clasp credentials
        if: always()
        run: rm -f ~/.clasprc.json

  deploy-backend-disabled:
    name: Deploy backend (prod, gated — DISABLED)
    needs: [github-release]
    runs-on: ubuntu-latest
    if: vars.BACKEND_DEPLOY_ENABLED != 'true'
    steps:
      - run: echo "BACKEND_DEPLOY_ENABLED repo variable is not 'true' — backend deploy skipped."
